version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hackaton-db
    environment:
      POSTGRES_USER: ${DB_USER:-hackaton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackaton123}
      POSTGRES_DB: ${DB_DATABASE:-hackaton}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-hackaton}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hackaton-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hackaton-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      HOST: ${HOST:-0.0.0.0}
      APP_KEY: ${APP_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hackaton}
      DB_PASSWORD: ${DB_PASSWORD:-hackaton123}
      DB_DATABASE: ${DB_DATABASE:-hackaton}
    ports:
      - '${PORT:-3333}:3333'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - hackaton-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        node ace migration:run --force &&
        node bin/server.js
      "

  # Development service (optional)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: hackaton-app-dev
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      APP_KEY: ${APP_KEY}
      LOG_LEVEL: debug
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hackaton}
      DB_PASSWORD: ${DB_PASSWORD:-hackaton123}
      DB_DATABASE: ${DB_DATABASE:-hackaton}
    ports:
      - '3333:3333'
      - '24678:24678' # Vite HMR port
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/build
    networks:
      - hackaton-network
    profiles:
      - dev
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  hackaton-network:
    driver: bridge
